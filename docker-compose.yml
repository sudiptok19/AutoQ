services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoq
      POSTGRES_PASSWORD: autoq-dev
      POSTGRES_DB: autoq
    # Host port is configurable; 5433 avoids clashing with other local Postgres instances.
    ports: ["${AUTOQ_DB_PORT:-5433}:5432"]
    volumes: [autoq-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoq"]
      interval: 2s
      retries: 30
volumes:
  autoq-db:
