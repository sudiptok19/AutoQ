[project]
name = "autoq-backend"
version = "0.1.0"
description = "AutoQ-Trace API: policy engine, genealogy, dispatch gate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "pynacl>=1.5",
  "python-multipart>=0.0.12",
  # Astra's modules (pre-added so Astra never edits this manifest)
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "reportlab>=4.2",
  "jsonschema>=4.23",
  "pillow>=11.0",  # seal_vision (Astra A2) EXIF orientation
  "simplejpeg==1.9.0",  # component/seal vision (Astra): strict JPEG decode incl. trailing-data phone captures
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["nodb: pure test that must not touch PostgreSQL"]
